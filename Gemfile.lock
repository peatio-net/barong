source 'https://rubygems.org'
git_source(:github) { |repo| "https://github.com/#{repo}.git" }

ruby '~> 3.3.5'

# Core Rails and server - INCREMENTAL UPGRADE PATH
# Phase 1: Start with Rails 6.1 (intermediate step)
gem 'rails', '~> 6.1.0'  # Will upgrade to 7.0 in next phase
gem 'puma', '~> 5.0'     # Intermediate version, will go to 6.0+ later
gem 'bootsnap', '~> 1.12.0', require: false  # Intermediate version

# Database - Updated for Ruby 3.3.5 compatibility
gem 'mysql2', '~> 0.5.4'  # Updated from 0.5.3
gem 'pg', '~> 1.4'        # Updated from 1.2

# Redis and caching - Updated for Ruby 3.3.5
gem 'redis', '~> 4.8'     # Intermediate version (will go to 5.0+ later)
gem 'hiredis', '~> 0.6.1'

# Background jobs - Updated for better Ruby 3.3.5 support
gem 'sidekiq', '~> 6.5'   # Intermediate version (will go to 7.0+ later)

# API framework - Updated for Ruby 3.3.5
gem 'grape', '~> 1.7'           # Intermediate version (will go to 2.0+ later)
gem 'grape-entity', '~> 0.10'   # Updated from 0.8
gem 'grape-swagger', '~> 1.6'   # Updated from 1.2
gem 'grape-swagger-entity', '~> 0.5'
gem 'grape_logging', '~> 1.8'
gem 'api-pagination', '~> 5.0'  # Updated from 4.8.2

# Authentication and security - CRITICAL UPDATES
gem 'bcrypt', '~> 3.1.18'       # Updated from 3.1.15
gem 'jwt', '~> 2.7'             # Updated from 2.2
gem 'jwt-multisig', '~> 1.0', '>= 1.0.4'
gem 'cancancan', '~> 3.4'       # Updated from 2.3.0

# Validation and verification - SECURITY UPDATES
gem 'email_validator', '~> 2.2'  # Updated from locked 1.6.0
gem 'recaptcha', '~> 5.12'       # Updated from 5.2.1
gem 'strong_password', '~> 0.0.10'  # Updated from 0.0.8
gem 'phonelib', '~> 0.8'         # Updated from 0.10.3

# Cloud storage - Updated for Ruby 3.3.5
gem 'carrierwave', '~> 2.2'      # Updated from 2.1
gem 'fog-core', '~> 2.3'         # Updated from 2.1.0
gem 'fog-aliyun', '~> 0.4'       # Updated from 0.3.5
gem 'fog-aws', '~> 3.25'         # Updated from 3.24.0
gem 'fog-google', '~> 1.22'      # Updated from 1.20.0

# External services - Updated versions
gem 'aliyun-sdk', '~> 0.8'       # Updated from 0.7.0
gem 'twilio-ruby', '~> 5.73'     # Updated from 5.25.4
gem 'kycaid'
gem 'vault', '~> 0.17'           # Updated from 0.1
gem 'vault-rails', git: 'https://github.com/rubykube/vault-rails'

# Messaging - Added version constraint
gem 'bunny', '~> 2.20'           # Updated from 2.15.0

# Cryptography - Updated for Ruby 3.3.5
gem 'base58', '~> 0.2.3'
gem 'blake2b', '~> 0.10.0'
gem 'ed25519', '~> 1.3'          # Updated from 1.2.4

# Utilities - Updated versions
gem 'env-tweaks', '~> 1.0.0'
gem 'kaminari', '~> 1.2'
gem 'peatio', '~> 0.4.4'
gem 'rack-cors', '~> 1.1'        # Updated from 1.0.2
gem 'rack-attack', '~> 6.6'      # Updated from 6.5.0
gem 'memoist', '~> 0.16'
gem 'maxmind-db', '~> 1.2'       # Updated from 1.0
gem 'countries', '~> 5.0', require: 'countries/global'
gem 'browser', '~> 5.0', require: "browser/browser"
gem 'bump', '~> 0.10'

# Asset pipeline - Updated for Ruby 3.3.5
gem 'uglifier', '~> 4.2'         # Updated from 1.3.0
gem 'mini_racer', '~> 0.6', platforms: :ruby

# Monitoring and logging - CRITICAL: Replace deprecated sentry-raven
gem 'sentry-ruby', '~> 5.15'     # REPLACES sentry-raven
gem 'sentry-rails', '~> 5.15'    # NEW: Rails integration

# Development tools
gem 'pry-rails', '~> 0.3'

group :development, :test do
  gem 'pry-byebug', '~> 3.10', platforms: [:mri, :mingw, :x64_mingw]
  gem 'factory_bot_rails', '~> 6.2'  # Updated from 4.11
  gem 'faker', '~> 3.0'              # Updated from 2.1
  gem 'rspec-rails', '~> 5.0'        # Updated from 3.9 (intermediate)
end

group :development do
  gem 'grape_on_rails_routes', '~> 0.3.2'
  gem 'web-console', '~> 4.2'        # Updated from 3.7.0
  gem 'listen', '~> 3.8'             # Updated from 3.2
  gem 'annotate', '~> 3.2'           # Updated from 2.7
end

group :test do
  gem 'capybara', '~> 3.38'                    # Updated from 3.29.0
  gem 'shoulda-matchers', '~> 5.0'             # Updated from 4.0.1.0
  gem 'rails-controller-testing', '~> 1.0.5'
  gem 'database_cleaner-active_record', '~> 2.1'  # Updated from database_cleaner
end